name: tokenenrich-mcp
displayName: TokenEnrich
description: Sub-140ms B2B Company Intelligence & Technographic Signal API in ~180 Tokens for AI Agents & Claude Desktop.
version: 1.1.0
homepage: https://tokenenrich.com
repository: https://github.com/quitegoodproject/tokenenrich
license: MIT
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: TokenEnrich API Key (optional for free tier)
      email:
        type: string
        description: Developer work email (unlocks 100 free requests automatically)
  commandFunction:
    name: npx
    args:
      - -y
      - "@quitegoodproject/tokenenrich-mcp@1.1.0"
